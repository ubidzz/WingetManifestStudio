name: Bug report
description: Report something that is broken or confusing in Winget Manifest Studio.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Winget Manifest Studio. Do not paste GitHub tokens, passwords, certificate keys, or other private information.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain what you expected and what happened instead.
      placeholder: I expected... but the Studio...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact buttons and fields used, in order.
      placeholder: |
        1. Open the Studio
        2. Choose...
        3. Enter...
        4. See the error
    validations:
      required: true

  - type: dropdown
    id: workflow-step
    attributes:
      label: Where did it happen?
      options:
        - Startup or publishing
        - 1 Start
        - 2 Package
        - 3 Installers
        - 4 Review
        - 5 Test Center
        - Help
        - Official Tools
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Studio version
      description: Find this in the application or the downloaded release name.
      placeholder: 1.1.0

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2

  - type: textarea
    id: evidence
    attributes:
      label: Error text, report, or screenshots
      description: Drag screenshots here and paste non-sensitive error text. Remove personal paths if needed.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked for an existing issue describing the same problem.
          required: true
        - label: I removed tokens, credentials, and other private information.
          required: true
