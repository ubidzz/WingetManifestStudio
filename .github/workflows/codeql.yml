name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: ManifestUpdater/WingetManifestStudio.csproj

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore WingetManifestStudio.slnx

      - name: Build for analysis
        shell: pwsh
        run: >-
          dotnet build ManifestUpdater/WingetManifestStudio.csproj
          --configuration Release
          --no-restore
          -p:BuildStudioMsi=false

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
